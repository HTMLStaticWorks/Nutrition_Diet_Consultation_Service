<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nourish</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .auth-container { min-height: 100vh; position: relative; }
        .hover-underline:hover { text-decoration: underline !important; color: var(--primary-green) !important; }
        .password-toggle { cursor: pointer; }
        .top-right-actions { position: absolute; top: 20px; right: 20px; z-index: 10; }
        .social-btn { border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); border-radius: 50px; font-weight: 500; padding: 10px; transition: var(--transition); }
        .social-btn:hover { background: var(--light-sage); }
        [data-theme="dark"] .social-btn { color: #F4F7F3; }
        [data-theme="dark"] .social-btn:hover { background: #244634; }
    </style>
</head>
<body class="bg-cream">
    <div class="auth-container d-flex align-items-center justify-content-center">
        <!-- Top right icons -->
        <div class="top-right-actions d-flex gap-3">
            <a href="#" id="darkModeToggleBtn" class="text-secondary text-decoration-none" title="Toggle Dark Mode"><i class="fas fa-moon fs-5"></i></a>
            <a href="#" id="rtlToggle" class="text-secondary text-decoration-none" title="Toggle RTL"><i class="fas fa-exchange-alt fs-5"></i></a>
        </div>

        <div class="w-100 p-4" style="max-width: 450px;">
            
            
            <div class="card-premium p-4 p-md-5">
                <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2">
                    <img src="assets/images/favicon.svg" alt="Nourish Logo" width="28" height="28">
                    <span class="fw-bold fs-4 text-green" style="font-family: var(--font-accent);">Nourish.</span>
                </a>
            </div>
        <h4 class="mb-4 text-center">Welcome Back</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark-green">Email</label>
                        <input type="email" class="form-control p-3 bg-light border-0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark-green">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control p-3 bg-light border-0" id="passwordInput">
                            <span class="input-group-text bg-light border-0 password-toggle" onclick="togglePassword('passwordInput', this)"><i class="fas fa-eye text-secondary"></i></span>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4 small">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-secondary hover-underline" style="cursor:pointer;" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="text-green text-decoration-none hover-underline fw-bold">Forgot password?</a>
                    </div>
                    <a href="dashboard.html" class="btn-primary w-100 text-center text-decoration-none mb-4 d-block">Login</a>
                    
                    <div class="position-relative text-center mb-4">
                        <hr class="text-secondary">
                        <span class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-secondary small">OR</span>
                    </div>

                    <div class="d-flex flex-column gap-3">
                        <button type="button" class="social-btn w-100 d-flex align-items-center justify-content-center gap-2">
                            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" width="20" height="20"> Continue with Google
                        </button>
                        <button type="button" class="social-btn w-100 d-flex align-items-center justify-content-center gap-2">
                            <i class="fab fa-apple fs-5"></i> Continue with Apple
                        </button>
                    </div>
                </form>
                <p class="mt-4 mb-0 text-center text-secondary">Don't have an account? <a href="register.html" class="text-green fw-bold text-decoration-none hover-underline">Register</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            const icon = iconElement.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
